<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎂 Don't Blow Too Hard!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0; background: #0f172a;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; touch-action: none; font-family: 'Courier New', Courier, monospace;
        }

        /* 搞怪提示语放在中间顶部 */
        #status-tip {
            position: fixed; top: 15%; width: 100%; text-align: center;
            color: #fbbf24; font-size: 18px; font-weight: bold;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
            z-index: 1500; pointer-events: none;
            transition: all 0.3s;
        }

        .cake-stage { position: relative; width: 300px; height: 300px; transition: transform 0.1s; }
        .hotspot-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; }
        .hitbox { position: absolute; width: 60px; height: 120px; transform: translateX(-50%); -webkit-tap-highlight-color: transparent; }
        
        .smoke {
            position: absolute; width: 10px; height: 10px; background: rgba(255,255,255,0.4);
            border-radius: 50%; pointer-events: none; filter: blur(3px);
            animation: puff 0.7s ease-out forwards; z-index: 2000;
        }
        @keyframes puff { to { transform: translateY(-100px) scale(4); opacity: 0; } }

        svg { width: 100%; height: 100%; pointer-events: none; }
        .flame { fill: #ff9d00; animation: flicker 0.1s infinite alternate; transform-origin: center bottom; }
        @keyframes flicker { from { transform: scale(1); } to { transform: scale(1.1); } }
        .out .flame { display: none; }
        .out .candle-body { fill: #475569 !important; opacity: 0.5; }

        .corner-controls { position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 1100; }
        .btn-circle {
            width: 60px; height: 60px; border-radius: 50%; border: none;
            color: white; font-size: 24px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .btn-circle:active { transform: scale(0.9); }
        #micBtn { background: #ef4444; }
        #musicBtn { background: #3b82f6; }

        #wish {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 40px; border-radius: 30px; text-align: center;
            display: none; z-index: 3000; box-shadow: 0 0 100px rgba(0,0,0,0.8); width: 85%;
        }
    </style>
</head>
<body>

    <div id="status-tip">Ready to make a mess? Click the 🎤</div>

    <div class="cake-stage" id="cake">
        <div class="hotspot-layer">
            <div class="hitbox" style="left: 28%; top: 15%;" data-idx="0"></div>
            <div class="hitbox" style="left: 39%; top: 10%;" data-idx="1"></div>
            <div class="hitbox" style="left: 50%; top: 5%;" data-idx="2"></div>
            <div class="hitbox" style="left: 61%; top: 10%;" data-idx="3"></div>
            <div class="hitbox" style="left: 72%; top: 15%;" data-idx="4"></div>
        </div>

        <svg viewBox="0 0 200 220">
            <rect x="20" y="140" width="160" height="60" rx="10" fill="#e67e22" />
            <rect x="40" y="90" width="120" height="50" rx="10" fill="#ffb347" />
            <g id="candle-0" class="candle-group"><rect class="candle-body" x="55" y="60" width="8" height="30" fill="#FF6B6B" rx="2"/><path class="flame" d="M59 45 Q63 52 59 60 Q55 52 59 45" /></g>
            <g id="candle-1" class="candle-group"><rect class="candle-body" x="78" y="55" width="8" height="35" fill="#4ECDC4" rx="2"/><path class="flame" d="M82 40 Q86 47 82 55 Q78 47 82 40" /></g>
            <g id="candle-2" class="candle-group"><rect class="candle-body" x="96" y="50" width="8" height="40" fill="#FFE66D" rx="2"/><path class="flame" d="M100 35 Q104 42 100 50 Q96 42 100 35" /></g>
            <g id="candle-3" class="candle-group"><rect class="candle-body" x="114" y="55" width="8" height="35" fill="#FF9F43" rx="2"/><path class="flame" d="M118 40 Q122 47 118 55 Q114 47 118 40" /></g>
            <g id="candle-4" class="candle-group"><rect class="candle-body" x="137" y="60" width="8" height="30" fill="#A29BFE" rx="2"/><path class="flame" d="M141 45 Q145 52 141 60 Q137 52 141 45" /></g>
        </svg>
    </div>

    <div class="corner-controls">
        <button class="btn-circle" id="micBtn">🎤</button>
        <button class="btn-circle" id="musicBtn" onclick="toggleMusic()">🎵</button>
    </div>

    <div id="wish">
        <h1 style="font-size: 50px; margin:0;">🎁</h1>
        <h2>Surprise!</h2>
        <p id="blessingText"></p>
        <button onclick="location.reload()" style="padding:12px 24px; margin-top: 20px; cursor: pointer; border-radius: 12px; background: #3b82f6; color: white; border: none;">Try Again</button>
    </div>

    <audio id="bgm" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"></audio>

    <script>
        const blessings = [
            "I don’t say this often, but I truly respect the way you move through life. Stay steady. Stay sharp. This year, take up more space — you’ve earned it.",
            "I hope this year feels lighter for you. Less pressure, more clarity. And may you always remember — you’re stronger than you think.",
            "This year, stop underestimating yourself. Go after what you want — seriously. I’d love to see you win.",
            "Stay healthy. Stay grounded. Keep building the life you actually want.",
            "I’m really grateful to have you in my life. You make things feel steadier than they would otherwise be. I hope this year brings you the kind of peace you give to others."
        ];

        let count = 0;
        const total = 5;
        const tip = document.getElementById('status-tip');
        const cake = document.getElementById('cake');

        function toggleMusic() {
            const audio = document.getElementById('bgm');
            if (audio.paused) { audio.play(); document.getElementById('musicBtn').innerText = "⏸"; }
            else { audio.pause(); document.getElementById('musicBtn').innerText = "🎵"; }
        }

        function blowOut(idx, x, y) {
            const candle = document.getElementById('candle-' + idx);
            if (candle && !candle.classList.contains('out')) {
                candle.classList.add('out');
                count++;
                if(x && y) spawnSmoke(x, y);

                // 搞怪机制：1/3 概率有一根蜡烛复燃 (仅在前三根熄灭时触发)
                if (count < 4 && Math.random() > 0.7) {
                    setTimeout(() => {
                        candle.classList.remove('out');
                        count--;
                        tip.innerText = "💨 WAIT! IT'S BACK!";
                        tip.style.color = "#ef4444";
                    }, 1500);
                }

                if (count === total) {
                    confetti({ particleCount: 200, spread: 80, origin: { y: 0.7 } });
                    tip.innerText = "🎉 MISSION ACCOMPLISHED!";
                    document.getElementById('blessingText').innerText = blessings[Math.floor(Math.random() * blessings.length)];
                    setTimeout(() => { document.getElementById('wish').style.display = 'block'; }, 600);
                }
            }
        }

        // 统一点击处理
        document.querySelectorAll('.hitbox').forEach(box => {
            const act = (e) => {
                const t = e.touches ? e.touches[0] : e;
                blowOut(box.dataset.idx, t.clientX, t.clientY);
            };
            box.addEventListener('touchstart', act);
            box.addEventListener('mousedown', act);
        });

        function spawnSmoke(x, y) {
            const s = document.createElement('div');
            s.className = 'smoke';
            s.style.left = x + 'px'; s.style.top = y + 'px';
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 700);
        }

        document.getElementById('micBtn').onclick = async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = ctx.createAnalyser();
                ctx.createMediaStreamSource(stream).connect(analyser);
                this.style.background = "#22c55e";
                
                const data = new Uint8Array(analyser.frequencyBinCount);
                const loop = () => {
                    analyser.getByteFrequencyData(data);
                    let vol = data.reduce((a, b) => a + b) / data.length;
                    
                    if (vol > 30) {
                        tip.innerText = vol > 60 ? "WHOA! CHILL!" : "💨 BLOWING IN PROGRESS...";
                        tip.style.color = vol > 60 ? "#ef4444" : "#fbbf24";
                        // 蛋糕随声音震动
                        cake.style.transform = `translate(${Math.random()*vol/10}px, ${Math.random()*vol/10}px)`;
                    }

                    if (vol > 55) {
                        const alive = [0,1,2,3,4].filter(i => !document.getElementById('candle-'+i).classList.contains('out'));
                        if (alive.length > 0) {
                            const id = alive[Math.floor(Math.random()*alive.length)];
                            const b = document.querySelector(`[data-idx="${id}"]`).getBoundingClientRect();
                            blowOut(id, b.left+30, b.top+20);
                        }
                    }
                    requestAnimationFrame(loop);
                };
                loop();
            } catch (err) { tip.innerText = "❌ Mic blocked!"; }
        };
    </script>
</body>
</html>
