<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎂 THE ULTIMATE BLOW CHALLENGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Spicy+Rice&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0; background: #020617;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; touch-action: none;
            font-family: 'Spicy Rice', cursive; /* 使用搞怪字体 */
        }

        /* 顶部氧气条 */
        #o2-container {
            position: fixed; top: 5%; width: 85%; height: 15px;
            background: #1e293b; border-radius: 20px; border: 3px solid #64748b;
        }
        #o2-bar { width: 100%; height: 100%; background: #22c55e; transition: width 0.1s; }
        #o2-label { color: #22c55e; position: absolute; top: -30px; left: 0; font-size: 20px; }

        /* 实时吹气力度显示 */
        #power-meter {
            position: fixed; top: 15%; width: 85%; text-align: center;
            color: #3b82f6; font-size: 24px; text-shadow: 2px 2px #000;
        }

        #status-tip {
            position: fixed; top: 22%; width: 100%; text-align: center;
            color: #fbbf24; font-size: 32px; z-index: 1500;
            transition: all 0.1s;
        }

        /* 搞怪警告动画 */
        .extreme-shake { animation: shake 0.1s infinite; color: #ff0000 !important; font-size: 45px !important; }
        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, -2px); }
        }

        .cake-stage { position: relative; width: 300px; height: 300px; }
        svg { width: 100%; height: 100%; pointer-events: none; }
        .flame { fill: #ff9d00; animation: flicker 0.1s infinite alternate; transform-origin: center bottom; }
        .out .flame { display: none; }
        .out .candle-body { fill: #475569 !important; opacity: 0.5; }

        /* 权限未开启时的遮罩 */
        #mic-shield {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 2000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
        }
        .mic-warning { color: #ef4444; font-size: 30px; padding: 20px; animation: pulse 1s infinite; }

        .corner-controls { position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 1100; }
        .btn-circle {
            width: 70px; height: 70px; border-radius: 50%; border: 5px solid white;
            color: white; font-size: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        #wish {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 40px; border-radius: 40px; text-align: center;
            display: none; z-index: 3000; box-shadow: 0 0 100px #000; width: 85%;
        }
        #wish h2 { font-size: 45px; color: #ef4444; }
        #wish p { font-size: 28px; color: #334155; line-height: 1.2; }
    </style>
</head>
<body>

    <div id="mic-shield">
        <div class="mic-warning">⚠️ SYSTEM LOCKED ⚠️<br>MIC PERMISSION REQUIRED!</div>
        <p style="color: white; font-size: 18px;">Tap the Red Button Below to Unlock</p>
    </div>

    <div id="o2-container">
        <div id="o2-label">OXYGEN LEVEL</div>
        <div id="o2-bar"></div>
    </div>

    <div id="power-meter">BLOW POWER: 0%</div>
    <div id="status-tip">WATING FOR WIND...</div>

    <div class="cake-stage" id="cake">
        <svg viewBox="0 0 200 220">
            <rect x="20" y="140" width="160" height="60" rx="15" fill="#e67e22" />
            <rect x="40" y="90" width="120" height="50" rx="15" fill="#ffb347" />
            <g id="candle-0"><rect class="candle-body" x="55" y="60" width="8" height="30" fill="#FF6B6B" rx="2"/><path class="flame" d="M59 45 Q63 52 59 60 Q55 52 59 45" /></g>
            <g id="candle-1"><rect class="candle-body" x="78" y="55" width="8" height="35" fill="#4ECDC4" rx="2"/><path class="flame" d="M82 40 Q86 47 82 55 Q78 47 82 40" /></g>
            <g id="candle-2"><rect class="candle-body" x="96" y="50" width="8" height="40" fill="#FFE66D" rx="2"/><path class="flame" d="M100 35 Q104 42 100 50 Q96 42 100 35" /></g>
            <g id="candle-3"><rect class="candle-body" x="114" y="55" width="8" height="35" fill="#FF9F43" rx="2"/><path class="flame" d="M118 40 Q122 47 118 55 Q114 47 118 40" /></g>
            <g id="candle-4"><rect class="candle-body" x="137" y="60" width="8" height="30" fill="#A29BFE" rx="2"/><path class="flame" d="M141 45 Q145 52 141 60 Q137 52 141 45" /></g>
        </svg>
    </div>

    <div class="corner-controls">
        <button class="btn-circle" id="micBtn" style="background: #ef4444;">🎤</button>
        <button class="btn-circle" id="musicBtn" onclick="toggleMusic()" style="background: #3b82f6;">🎵</button>
    </div>

    <div id="wish">
        <h1 style="font-size: 70px; margin:0;">🎊</h1>
        <h2 id="wish-title">HAPPY B-DAY!</h2>
        <p id="blessingText"></p>
        <button onclick="location.reload()" style="padding:15px 30px; font-family: inherit; font-size: 25px; cursor:pointer; background:#22c55e; color:white; border:none; border-radius:15px;">PLAY AGAIN</button>
    </div>

    <audio id="bgm" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"></audio>
    <audio id="horn-sfx" src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3"></audio>

    <script>
        const blessings = [
            "I don’t say this often, but I truly respect the way you move through life. Stay steady. Stay sharp. This year, take up more space — you’ve earned it.",
            "I hope this year feels lighter for you. Less pressure, more clarity. And may you always remember — you’re stronger than you think.",
            "This year, stop underestimating yourself. Go after what you want — seriously. I’d love to see you win.",
            "Stay healthy. Stay grounded. Keep building the life you actually want.",
            "I’m really grateful to have you in my life. You make things feel steadier than they would otherwise be. I hope this year brings you the kind of peace you give to others."
        ];

        let count = 0;
        let o2 = 100;
        let isGameOver = false;
        const tip = document.getElementById('status-tip');
        const powerLabel = document.getElementById('power-meter');
        const cake = document.getElementById('cake');

        function toggleMusic() {
            const audio = document.getElementById('bgm');
            if (audio.paused) { audio.play(); document.getElementById('musicBtn').innerText = "⏸"; }
            else { audio.pause(); document.getElementById('musicBtn').innerText = "🎵"; }
        }

        function blowOut(idx) {
            if(isGameOver) return;
            const candle = document.getElementById('candle-' + idx);
            if (candle && !candle.classList.contains('out')) {
                candle.classList.add('out');
                count++;
                if (count < 4 && Math.random() > 0.85) {
                    setTimeout(() => { if(!isGameOver) { candle.classList.remove('out'); count--; tip.innerText = "IT CAME BACK! 🔥"; }}, 1000);
                }
                if (count === 5) win();
            }
        }

        function win() {
            isGameOver = true;
            document.getElementById('horn-sfx').play();
            confetti({ particleCount: 300, spread: 100, origin: { y: 0.6 } });
            document.getElementById('blessingText').innerText = blessings[Math.floor(Math.random() * blessings.length)];
            setTimeout(() => { document.getElementById('wish').style.display = 'block'; }, 600);
        }

        document.getElementById('micBtn').onclick = async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = ctx.createAnalyser();
                ctx.createMediaStreamSource(stream).connect(analyser);
                
                document.getElementById('mic-shield').style.display = 'none'; // 解锁屏幕
                this.style.boxShadow = "0 0 40px #22c55e";
                
                const data = new Uint8Array(analyser.frequencyBinCount);
                const loop = () => {
                    if(isGameOver) return;
                    analyser.getByteFrequencyData(data);
                    let vol = data.reduce((a, b) => a + b) / data.length;
                    
                    // 1. 实时更新力度计
                    let powerPercent = Math.min(100, Math.floor(vol * 1.5));
                    powerLabel.innerText = `BLOW POWER: ${powerPercent}%`;
                    powerLabel.style.color = vol > 50 ? '#ef4444' : '#3b82f6';

                    if (vol > 10) {
                        // 2. 氧气消耗
                        o2 -= (vol / 110);
                        if (o2 <= 0) { isGameOver = true; tip.innerText = "YOU FAINTED! 😵"; document.getElementById('wish').style.display = 'block'; document.getElementById('wish-title').innerText = "FAILED!"; }
                        document.getElementById('o2-bar').style.width = o2 + "%";

                        // 3. 搞怪提示与震动
                        if (vol > 65) {
                            tip.innerText = "CALM DOWN! 😡";
                            tip.classList.add('extreme-shake');
                            cake.style.transform = `scale(${1 + vol/200}) rotate(${Math.random()*10 - 5}deg)`;
                        } else {
                            tip.innerText = "KEEP BLOWING! 💨";
                            tip.classList.remove('extreme-shake');
                            cake.style.transform = `translate(${Math.random()*vol/5}px, ${Math.random()*vol/5}px)`;
                        }
                    } else {
                        tip.innerText = "Too weak! Eat more cake! 🍰";
                        tip.classList.remove('extreme-shake');
                        cake.style.transform = "none";
                    }

                    // 4. 判定熄灭
                    if (vol > 45) {
                        const alive = [0,1,2,3,4].filter(i => !document.getElementById('candle-'+i).classList.contains('out'));
                        if (alive.length > 0) blowOut(alive[Math.floor(Math.random()*alive.length)]);
                    }
                    requestAnimationFrame(loop);
                };
                loop();
            } catch (err) { alert("Mic Access Denied!"); }
        };
    </script>
</body>
</html>
