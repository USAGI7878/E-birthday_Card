<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎂 O2 CHALLENGE: DON'T STOP!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0; background: #020617;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; touch-action: none; font-family: 'Courier New', Courier, monospace;
        }

        /* 氧气条容器 */
        #o2-container {
            position: fixed; top: 10%; width: 80%; height: 20px;
            background: #1e293b; border-radius: 10px; border: 2px solid #64748b; overflow: hidden;
        }
        #o2-bar {
            width: 100%; height: 100%; background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
            transition: width 0.1s linear;
        }
        #o2-label { color: white; position: absolute; top: -25px; left: 0; font-size: 14px; font-weight: bold; }

        #status-tip {
            position: fixed; top: 18%; width: 100%; text-align: center;
            color: #fbbf24; font-size: 18px; font-weight: bold; z-index: 1500;
        }

        .cake-stage { position: relative; width: 300px; height: 300px; transition: transform 0.05s; }
        .hotspot-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; }
        .hitbox { position: absolute; width: 60px; height: 120px; transform: translateX(-50%); -webkit-tap-highlight-color: transparent; }
        
        svg { width: 100%; height: 100%; pointer-events: none; }
        .flame { fill: #ff9d00; animation: flicker 0.1s infinite alternate; transform-origin: center bottom; }
        @keyframes flicker { from { transform: scale(1); } to { transform: scale(1.1); } }
        .out .flame { display: none; }
        .out .candle-body { fill: #475569 !important; opacity: 0.5; }

        .corner-controls { position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 1100; }
        .btn-circle {
            width: 60px; height: 60px; border-radius: 50%; border: none;
            color: white; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        #micBtn { background: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
        #musicBtn { background: #3b82f6; }

        #wish {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 40px; border-radius: 30px; text-align: center;
            display: none; z-index: 3000; box-shadow: 0 0 100px rgba(0,0,0,0.8); width: 85%;
        }
    </style>
</head>
<body>

    <div id="o2-container">
        <div id="o2-label">OXYGEN LEVEL: 100%</div>
        <div id="o2-bar"></div>
    </div>

    <div id="status-tip">GET READY TO BLOW!</div>

    <div class="cake-stage" id="cake">
        <div class="hotspot-layer">
            <div class="hitbox" style="left: 28%; top: 15%;" data-idx="0"></div>
            <div class="hitbox" style="left: 39%; top: 10%;" data-idx="1"></div>
            <div class="hitbox" style="left: 50%; top: 5%;" data-idx="2"></div>
            <div class="hitbox" style="left: 61%; top: 10%;" data-idx="3"></div>
            <div class="hitbox" style="left: 72%; top: 15%;" data-idx="4"></div>
        </div>

        <svg viewBox="0 0 200 220">
            <rect x="20" y="140" width="160" height="60" rx="10" fill="#e67e22" />
            <rect x="40" y="90" width="120" height="50" rx="10" fill="#ffb347" />
            <g id="candle-0"><rect class="candle-body" x="55" y="60" width="8" height="30" fill="#FF6B6B" rx="2"/><path class="flame" d="M59 45 Q63 52 59 60 Q55 52 59 45" /></g>
            <g id="candle-1"><rect class="candle-body" x="78" y="55" width="8" height="35" fill="#4ECDC4" rx="2"/><path class="flame" d="M82 40 Q86 47 82 55 Q78 47 82 40" /></g>
            <g id="candle-2"><rect class="candle-body" x="96" y="50" width="8" height="40" fill="#FFE66D" rx="2"/><path class="flame" d="M100 35 Q104 42 100 50 Q96 42 100 35" /></g>
            <g id="candle-3"><rect class="candle-body" x="114" y="55" width="8" height="35" fill="#FF9F43" rx="2"/><path class="flame" d="M118 40 Q122 47 118 55 Q114 47 118 40" /></g>
            <g id="candle-4"><rect class="candle-body" x="137" y="60" width="8" height="30" fill="#A29BFE" rx="2"/><path class="flame" d="M141 45 Q145 52 141 60 Q137 52 141 45" /></g>
        </svg>
    </div>

    <div class="corner-controls">
        <button class="btn-circle" id="micBtn">🎤</button>
        <button class="btn-circle" id="musicBtn" onclick="toggleMusic()">🎵</button>
    </div>

    <div id="wish">
        <h1 id="wish-icon">🎁</h1>
        <h2 id="wish-title">Surprise!</h2>
        <p id="blessingText"></p>
        <button onclick="location.reload()" style="padding:12px 24px; margin-top: 20px; cursor: pointer; border-radius: 12px; background: #3b82f6; color: white; border: none;">RETRY CHALLENGE</button>
    </div>

    <audio id="bgm" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"></audio>
    <audio id="horn-sfx" src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3"></audio>

    <script>
        const blessings = [
            "I don’t say this often, but I truly respect the way you move through life. Stay steady. Stay sharp. This year, take up more space — you’ve earned it.",
            "I hope this year feels lighter for you. Less pressure, more clarity. And may you always remember — you’re stronger than you think.",
            "This year, stop underestimating yourself. Go after what you want — seriously. I’d love to see you win.",
            "Stay healthy. Stay grounded. Keep building the life you actually want.",
            "I’m really grateful to have you in my life. You make things feel steadier than they would otherwise be. I hope this year brings you the kind of peace you give to others."
        ];

        let count = 0;
        let o2 = 100;
        let isGameOver = false;
        const total = 5;
        const tip = document.getElementById('status-tip');
        const o2Bar = document.getElementById('o2-bar');
        const o2Label = document.getElementById('o2-label');
        const cake = document.getElementById('cake');

        function toggleMusic() {
            const audio = document.getElementById('bgm');
            if (audio.paused) { audio.play(); document.getElementById('musicBtn').innerText = "⏸"; }
            else { audio.pause(); document.getElementById('musicBtn').innerText = "🎵"; }
        }

        function blowOut(idx) {
            if(isGameOver) return;
            const candle = document.getElementById('candle-' + idx);
            if (candle && !candle.classList.contains('out')) {
                candle.classList.add('out');
                count++;

                // 搞怪复燃机制
                if (count < 4 && Math.random() > 0.8) {
                    setTimeout(() => {
                        if(isGameOver) return;
                        candle.classList.remove('out');
                        count--;
                        tip.innerText = "🔥 OOPS! IT'S BACK!";
                    }, 1200);
                }

                if (count === total) {
                    win();
                }
            }
        }

        function win() {
            isGameOver = true;
            document.getElementById('horn-sfx').play();
            confetti({ particleCount: 250, spread: 90, origin: { y: 0.7 } });
            tip.innerText = "🏆 CHALLENGE COMPLETE!";
            document.getElementById('blessingText').innerText = blessings[Math.floor(Math.random() * blessings.length)];
            setTimeout(() => { document.getElementById('wish').style.display = 'block'; }, 600);
        }

        function gameOver() {
            isGameOver = true;
            tip.innerText = "💀 OUT OF OXYGEN!";
            tip.style.color = "#ef4444";
            document.getElementById('wish-icon').innerText = "😵";
            document.getElementById('wish-title').innerText = "FAILED!";
            document.getElementById('blessingText').innerText = "You ran out of air! Try to be more efficient next time.";
            document.getElementById('wish').style.display = 'block';
        }

        // 统一点击处理
        document.querySelectorAll('.hitbox').forEach(box => {
            box.addEventListener('mousedown', () => blowOut(box.dataset.idx));
            box.addEventListener('touchstart', (e) => { e.preventDefault(); blowOut(box.dataset.idx); });
        });

        document.getElementById('micBtn').onclick = async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = ctx.createAnalyser();
                ctx.createMediaStreamSource(stream).connect(analyser);
                this.style.background = "#22c55e";
                this.style.boxShadow = "0 0 30px #22c55e";
                
                const data = new Uint8Array(analyser.frequencyBinCount);
                const loop = () => {
                    if(isGameOver) return;
                    analyser.getByteFrequencyData(data);
                    let vol = data.reduce((a, b) => a + b) / data.length;
                    
                    if (vol > 15) {
                        // 消耗氧气：声音越大消耗越快
                        o2 -= (vol / 100);
                        if (o2 <= 0) { o2 = 0; gameOver(); }
                        
                        o2Bar.style.width = o2 + "%";
                        o2Label.innerText = `OXYGEN LEVEL: ${Math.floor(o2)}%`;
                        
                        // 震动效果
                        cake.style.transform = `translate(${Math.random()*vol/8}px, ${Math.random()*vol/8}px)`;
                        tip.innerText = "💨 BLOWING!!!";
                    }

                    if (vol > 55) {
                        const alive = [0,1,2,3,4].filter(i => !document.getElementById('candle-'+i).classList.contains('out'));
                        if (alive.length > 0) {
                            blowOut(alive[Math.floor(Math.random()*alive.length)]);
                        }
                    }
                    requestAnimationFrame(loop);
                };
                loop();
            } catch (err) { alert("Mic required!"); }
        };
    </script>
</body>
</html>
