<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎂 Birthday Wishes</title>
    <style>
        body {
            margin: 0; background: #0f172a;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; touch-action: none; font-family: sans-serif;
        }
        .container { position: relative; width: 350px; height: 350px; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
        
        /* Hitboxes for interaction */
        .hotspot-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; }
        .hitbox { position: absolute; width: 50px; height: 100px; transform: translateX(-50%); cursor: pointer; }

        .btn {
            z-index: 200; padding: 16px 32px; border-radius: 40px; border: none;
            background: #ef4444; color: white; font-size: 16px; margin-top: 20px;
            font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        #wish {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 40px; border-radius: 30px; text-align: center;
            display: none; z-index: 1000; box-shadow: 0 0 100px rgba(0,0,0,0.8); width: 80%;
        }
        #wish p { font-style: italic; color: #334155; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="cakeCanvas"></canvas>
        <div class="hotspot-layer">
            <div class="hitbox" style="left: 28%; top: 15%;" onclick="extinguish(0)"></div>
            <div class="hitbox" style="left: 39%; top: 10%;" onclick="extinguish(1)"></div>
            <div class="hitbox" style="left: 50%; top: 5%;"  onclick="extinguish(2)"></div>
            <div class="hitbox" style="left: 61%; top: 10%;" onclick="extinguish(3)"></div>
            <div class="hitbox" style="left: 72%; top: 15%;" onclick="extinguish(4)"></div>
        </div>
    </div>

    <button class="btn" id="micBtn">🎤 Enable Blow Mode</button>

    <div id="wish">
        <h1 style="font-size: 40px; margin:0;">🎂</h1>
        <h2 style="color: #ef4444;">Happy Birthday!</h2>
        <p id="blessingText"></p>
        <button onclick="location.reload()" style="margin-top:15px; padding:8px 16px;">Restart</button>
    </div>

    <script>
        const canvas = document.getElementById('cakeCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 350;
        canvas.height = 350;

        const blessings = [
            "I don’t say this often, but I truly respect the way you move through life. Stay steady. Stay sharp. This year, take up more space — you’ve earned it.",
            "I hope this year feels lighter for you. Less pressure, more clarity. And may you always remember — you’re stronger than you think.",
            "This year, stop underestimating yourself. Go after what you want — seriously. I’d love to see you win.",
            "Stay healthy. Stay grounded. Keep building the life you actually want.",
            "I’m really grateful to have you in my life. You make things feel steadier than they would otherwise be. I hope this year brings you the kind of peace you give to others."
        ];

        let candles = [
            { x: 100, y: 150, h: 40, color: '#FF6B6B', lit: true },
            { x: 135, y: 135, h: 45, color: '#4ECDC4', lit: true },
            { x: 175, y: 120, h: 50, color: '#FFE66D', lit: true },
            { x: 215, y: 135, h: 45, color: '#FF9F43', lit: true },
            { x: 250, y: 150, h: 40, color: '#A29BFE', lit: true }
        ];

        function drawStrawberry(x, y) {
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x-10, y-5, x, y-20);
            ctx.quadraticCurveTo(x+10, y-5, x, y);
            ctx.fill();
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(x-2, y-22, 4, 4);
        }

        function drawCream(x, y) {
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(x, y, 10, 0, Math.PI * 2);
            ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Bottom Cake Layer
            ctx.fillStyle = '#e67e22';
            ctx.beginPath();
            ctx.roundRect(50, 220, 250, 80, 15);
            ctx.fill();

            // 2. Top Cake Layer
            ctx.fillStyle = '#ffb347';
            ctx.beginPath();
            ctx.roundRect(80, 160, 190, 70, 15);
            ctx.fill();

            // 3. Decorations behind candles
            drawCream(90, 165);
            drawCream(260, 165);

            // 4. Draw Candles
            candles.forEach((c, i) => {
                // Body
                ctx.fillStyle = c.lit ? c.color : '#475569';
                ctx.fillRect(c.x - 4, c.y, 8, c.h);
                
                // Flame
                if (c.lit) {
                    ctx.fillStyle = '#ff9d00';
                    ctx.beginPath();
                    ctx.moveTo(c.x, c.y - 5);
                    ctx.quadraticCurveTo(c.x + 6, c.y - 12, c.x, c.y - 25);
                    ctx.quadraticCurveTo(c.x - 6, c.y - 12, c.x, c.y - 5);
                    ctx.fill();
                }
            });

            // 5. Decorations in front of candles (The "Grounded" look)
            drawCream(130, 160);
            drawCream(175, 155);
            drawCream(220, 160);
            drawStrawberry(110, 170);
            drawStrawberry(175, 165);
            drawStrawberry(240, 170);
            
            requestAnimationFrame(draw);
        }

        function extinguish(idx) {
            if(candles[idx].lit) {
                candles[idx].lit = false;
                checkWin();
            }
        }

        function checkWin() {
            if (candles.every(c => !c.lit)) {
                document.getElementById('blessingText').innerText = blessings[Math.floor(Math.random() * blessings.length)];
                setTimeout(() => { document.getElementById('wish').style.display = 'block'; }, 600);
            }
        }

        // Mic logic for phone/desktop
        document.getElementById('micBtn').onclick = async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(stream);
                analyser.fftSize = 256;
                source.connect(analyser);
                this.innerText = "💨 Listening... Blow!";
                this.style.background = "#22c55e";
                const data = new Uint8Array(analyser.frequencyBinCount);
                const loop = () => {
                    analyser.getByteFrequencyData(data);
                    let vol = data.reduce((a, b) => a + b) / data.length;
                    if (vol > 50) {
                        let active = candles.map((c,i) => c.lit ? i : -1).filter(i => i !== -1);
                        if (active.length > 0) extinguish(active[Math.floor(Math.random()*active.length)]);
                    }
                    if(candles.some(c => c.lit)) requestAnimationFrame(loop);
                };
                loop();
            } catch (err) { alert("Mic access denied. Tap candles instead!"); }
        };

        draw(); // Start animation loop
    </script>
</body>
</html>
